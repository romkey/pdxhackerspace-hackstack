services:
  chronograf:
    image: chronograf:${IMAGE_VERSION:-latest}
    container_name: chronograf
    hostname: chronograf
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ../../lib/chronograf:/var/lib/chronograf
#    command: chronograf --influxdb-url=http://influxdb:8086
#    ports:
#      - 8888:8888
    networks:
      - proxy
      - influxdb
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8888/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true
    name: nginx-proxy-net
  influxdb:
    external: true
    name: influxdb-net
