services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:${IMAGE_VERSION:-latest}
    hostname: audiobookshelf
    container_name: audiobookshelf
#    ports:
#      - 13378:80
    restart: unless-stopped
    volumes:
      - ../../lib/audiobookshelf/config:/config
      - ../../lib/audiobookshelf/metadata:/metadata
      - ../../lib/audiobookshelf/audiobooks:/audiobooks
      - ../../lib/audiobookshelf/podcasts:/podcasts
    env_file:
      - .env
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy:
    name: nginx-proxy-net
    external: true
