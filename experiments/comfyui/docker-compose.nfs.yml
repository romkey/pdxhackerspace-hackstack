# Optional override: ComfyUI runtime and models on NFS.
# Enabled through COMPOSE_STORAGE in .env.

services:
  comfyui:
    volumes: !override
      - comfyui_data:/data
      - ./config/extra_model_paths.yaml:/config/extra_model_paths.yaml:ro

volumes:
  comfyui_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${COMFYUI_NFS_HOST},rw,${NFS_MOUNT_OPTS:-nfsvers=4,hard}"
      device: ":${COMFYUI_NFS_PATH}"
