# Optional override: ComfyUI runtime and models on NFS. Add it last in COMPOSE_FILE, e.g.
#   COMPOSE_FILE=docker-compose.yml:docker-compose.nvidia.yml:docker-compose.nfs.yml

services:
  comfyui:
    volumes: !override
      - comfyui_data:/data
      - ./config/extra_model_paths.yaml:/config/extra_model_paths.yaml:ro

volumes:
  comfyui_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${COMFYUI_NFS_HOST},rw,${NFS_MOUNT_OPTS:-nfsvers=4,hard}"
      device: ":${COMFYUI_NFS_PATH}"
