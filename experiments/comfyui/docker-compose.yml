services:
  comfy-ui:
    image: ghcr.io/romkey/comfyui-docker:${IMAGE_VERSION:-latest}
    container_name: comfy-ui
    hostname: comfy-ui
    restart: unless-stopped
    shm_size: 8gb
    volumes:
      - ../../lib/comfyui:/data
      - ./config/extra_model_paths.yaml:/data/extra_model_paths.yaml:ro
    env_file:
      - .env
#   ports:
#     - 8188:8188
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://127.0.0.1:8188/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    networks:
      - proxy
      - llama

networks:
  proxy:
    external: true
    name: nginx-proxy-net
  llama:
    external: true
    name: llama-net
