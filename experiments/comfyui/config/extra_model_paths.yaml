# Extra model roots, on top of ComfyUI's own /data/models. Only loaded when .env
# sets COMFYUI_EXTRA_MODEL_PATHS_CONFIG=/config/extra_model_paths.yaml.
#
# Use it to share one copy of large weights with another container (e.g. vLLM):
# bind-mount that storage under /data/shared-models (or change base_path below).

shared:
    base_path: /data/shared-models
    diffusion_models: diffusion_models
    text_encoders: text_encoders
    vae: vae
    loras: loras
    checkpoints: checkpoints
    clip_vision: clip_vision
    upscale_models: upscale_models

# For MiniMax H3, the models directory should end up holding:
#
#   diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors   ~21 GB
#   diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors  (R2V only)
#   text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors          ~15.7 GB
#   vae/minimax_h3_video_vae_fp16.safetensors                           ~5.21 GB
#   vae/minimax_h3_audio_vae_fp32.safetensors                           ~605 MB
#
# From the Comfy-Org/MiniMax-H3 repo on Hugging Face — the repackaged one,
# not MiniMaxAI's raw weights, which are laid out differently.
