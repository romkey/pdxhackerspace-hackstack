# Optional override: ComfyUI storage on NFS.
# Enable: COMPOSE_FILE=docker-compose.yml:docker-compose.nfs.yml

services:
  comfy-ui:
    volumes: !override
      - comfy_ui_storage:/storage

volumes:
  comfy_ui_storage:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${COMFY_UI_NFS_HOST},rw,${NFS_MOUNT_OPTS:-nfsvers=4,hard}"
      device: ":${COMFY_UI_NFS_PATH}"
