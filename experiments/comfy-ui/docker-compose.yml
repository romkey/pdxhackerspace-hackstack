# ComfyUI on DGX Spark (GB10 / sm_121 / arm64)
# Adapted from mmartial/ComfyUI-Nvidia-Docker compose-dgx_spark.yaml
#
# BEFORE FIRST START, on the HOST:
#   git clone https://github.com/mmartial/ComfyUI-Nvidia-Docker
#   sudo ./ComfyUI-Nvidia-Docker/extras/dgx_spark-helper.sh
# (disables swap so you get clean OOM kills instead of a frozen box,
#  and caps GPU clocks for thermals)
#
# Directory layout expected next to this file:
#   ./userscripts_dir/    chmod +x the ones you want: 00 05 11 12 14 15 20 21
#   ./run/                container work dir
#   ./basedir/            ComfyUI base directory
#   ./extra_model_paths.yaml
# Plus MODELS_DIR from .env pointing at your big storage.

services:
  comfyui-nvidia:
    image: mmartial/comfyui-nvidia-docker:ubuntu24_cuda13.1-dgx-latest
    container_name: comfyui-nvidia
    restart: unless-stopped

    ports:
      # Loopback ONLY. ComfyUI has no authentication and Manager can install
      # arbitrary custom nodes = RCE as the container user. Front it with a
      # reverse proxy that authenticates before anything on the space network
      # can reach it.
#      - "127.0.0.1:${COMFY_PORT:-8188}:8188"
      - "${COMFY_PORT:-8188}:8188"

    volumes:
      - ../../lib/comfy-ui/userscripts_dir:/userscripts_dir
      - ../../lib/comfy-ui/run:/comfy/mnt
      - ../../lib/comfy-ui/basedir:/basedir
      - ./extra_model_paths.yaml:/extra_model_paths.yaml:ro
      # Big model storage, shared with the Qwen/vLLM container so you keep
      # one copy of anything both want.
      - ${MODELS_DIR}:/models
      - /etc/localtime:/etc/localtime:ro

    # Uncomment to reach the Qwen endpoint from inside Comfy nodes:
    # extra_hosts:
    #   - "qwen.internal:${QWEN_HOST_IP}"

    environment:
      WANTED_UID: ${WANTED_UID}
      WANTED_GID: ${WANTED_GID}
      BASE_DIRECTORY: /basedir

      USE_NEW_MANAGER: "true"
      ENABLE_MANAGER_LEGACY_UI: "true"

      # Upstream ships "weak". On a box 24x7 members can reach, don't.
      SECURITY_LEVEL: ${SECURITY_LEVEL}

      # NOTE: upstream's default here is
      #   --use-sage-attention --bf16-unet --bf16-vae --bf16-text-enc
      # Those bf16 flags are wrong for MiniMax H3: the whole point of the
      # pruned int8-convrot checkpoint and NVFP4 text encoder is the 42.5 GB
      # footprint, and forcing bf16 casting throws that away. Start without
      # them. Add back selectively only if a specific model needs it.
      #
      # --reserve-vram leaves headroom for the vLLM container on the shared
      # unified pool (no MIG on GB10 — this fence is cooperative only).
      COMFY_CMDLINE_EXTRA: >-
        --extra-model-paths-config=/extra_model_paths.yaml
        --reserve-vram ${RESERVE_VRAM_GB}

      NVIDIA_VISIBLE_DEVICES: all
      CUDA_HOME: /usr/local/cuda

      # 4 GB kernel cache. PTX forward-JITs to sm_121 on first kernel call,
      # then caches — worth ~3x on reruns. Don't drop this.
      CUDA_CACHE_MAXSIZE: "4294967296"
      NCCL_P2P_DISABLE: "1"

      USE_UV: "true"

      # Set false after the first successful run, or every restart reinstalls.
      FORCE_REINSTALL: ${FORCE_REINSTALL}

      # Enable ONLY after onnxruntime has built from source once, otherwise
      # it rebuilds on every single start. Same if you change CUDA version.
      ONNXRUNTIME_DO_NOT_DELETE_GPU_IF_PRESENT: "true"

      HF_TOKEN: ${HF_TOKEN}
      HF_HUB_DISABLE_TELEMETRY: "true"

      # Default umask 0022 leaves files world-readable. Shared box, your call.
      # UMASK: "0077"

    # PyTorch recommended: no locked-memory limit, 64 MiB stack
    ulimits:
      memlock: -1
      stack: 67108864

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
                - compute
                - utility
                - video   # libnvcuvid.so