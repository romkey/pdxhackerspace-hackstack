services:
  headscale:
    image: headscale/headscale:${IMAGE_VERSION:-v0.29.3}
    container_name: headscale
    hostname: headscale
    restart: unless-stopped
    command: serve
    labels:
      me.tale.headplane.target: headscale
    volumes:
      - ./config:/etc/headscale
      - ../../lib/headscale:/var/lib/headscale
      - ../../run/headscale:/var/run/headscale
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "/ko-app/headscale", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
#   ports:
#     - 8080:8080
      # Metrics also need metrics_listen_addr off loopback in config.yaml
#     - 9090:9090
      # STUN, only needed when the embedded DERP server is enabled in config.yaml
#     - 3478:3478/udp
    networks:
      - proxy
      # Only needed if database.type is switched to postgres in config.yaml
      # - db

  headplane:
    image: ghcr.io/tale/headplane:${HEADPLANE_IMAGE_VERSION:-v0.7.0}
    container_name: headplane
    hostname: headplane
    restart: unless-stopped
    depends_on:
      - headscale
    volumes:
      - ./config/headplane.yaml:/etc/headplane/config.yaml
      - ./config/config.yaml:/etc/headscale/config.yaml
      - ../../lib/headplane:/var/lib/headplane
      # Read-only is enough to find and restart headscale; Headplane writes
      # config.yaml through the bind mount above, not through the socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "/bin/hp_healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
#   ports:
#     - 3000:3000
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: nginx-proxy-net
# db:
#   external: true
#   name: postgres-net
