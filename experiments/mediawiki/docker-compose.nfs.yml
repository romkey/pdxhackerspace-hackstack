# Optional override: uploaded images on NFS.
# Enable: COMPOSE_FILE=docker-compose.yml:docker-compose.nfs.yml

services:
  mediawiki:
    volumes: !override
      - mediawiki_images:/var/www/html/images

volumes:
  mediawiki_images:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${MEDIAWIKI_NFS_HOST},rw,${NFS_MOUNT_OPTS:-nfsvers=4,hard}"
      device: ":${MEDIAWIKI_NFS_PATH}"
