services:
  camera2prusa:
    image: jtee3d/prusa_connect_rtsp:${IMAGE_VERSION:-latest}
    container_name: camera2prusa
    hostname: camera2prusa
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - camera2prusa
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f camera2prusa >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  camera2prusa:
    name: camera2prusa-net
