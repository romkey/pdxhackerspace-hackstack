# Optional override: Nextcloud data directory on NFS.
# Enable: COMPOSE_FILE=docker-compose.yml:docker-compose.nfs.yml

services:
  nextcloud:
    volumes: !override
      - nextcloud_data:/var/www/html

volumes:
  nextcloud_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NEXTCLOUD_NFS_HOST},rw,${NFS_MOUNT_OPTS:-nfsvers=4,hard}"
      device: ":${NEXTCLOUD_NFS_PATH}"
