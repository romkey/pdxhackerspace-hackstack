services:
  avahi:
    image: ydkn/avahi:${IMAGE_VERSION:-latest}
    container_name: avahi
    hostname: avahi
    restart: unless-stopped
    volumes:
      - ./services:/etc/avahi/services
    networks:
      - mdns
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f avahi-daemon >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  mdns:
    external: true
    name: mdns-net
