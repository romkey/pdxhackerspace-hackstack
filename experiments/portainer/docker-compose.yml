services:
  portainer:
    image: portainer/portainer-ce:${IMAGE_VERSION:-latest}
    container_name: portainer
    hostname: portainer
    restart: unless-stopped
    volumes:
      - ../../lib/portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock
#    ports:
#      - 9443:9443
#      - 8000:8000
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/api/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true
    name: nginx-proxy-net
