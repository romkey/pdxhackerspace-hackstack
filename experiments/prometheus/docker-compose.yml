services:
  prometheus:
    image: prom/prometheus:${IMAGE_VERSION:-latest}
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
    volumes:
      - ./config:/etc/prometheus:ro
      - ../../lib/prometheus:/prometheus
    env_file:
      - .env
    extra_hosts:
      # lets jobs reach services that only publish ports on the host (e.g. upsd)
      - host.docker.internal:host-gateway
#    ports:
#      - 9090:9090
    networks:
      - prometheus
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_IMAGE_VERSION:-latest}
    container_name: node-exporter
    hostname: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_IMAGE_VERSION:-latest}
    container_name: cadvisor
    hostname: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nut-exporter:
    image: ghcr.io/druggeri/nut_exporter:${NUT_EXPORTER_IMAGE_VERSION:-latest}
    container_name: nut-exporter
    hostname: nut-exporter
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - prometheus

# Uncomment when there's network gear to poll; see README
#  snmp-exporter:
#    image: prom/snmp-exporter:${SNMP_EXPORTER_IMAGE_VERSION:-latest}
#    container_name: snmp-exporter
#    hostname: snmp-exporter
#    restart: unless-stopped
#    networks:
#      - prometheus

networks:
  prometheus:
    name: prometheus-net
  proxy:
    external: true
    name: nginx-proxy-net
