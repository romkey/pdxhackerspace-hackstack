services:
  influxdb:
    image: influxdb:${IMAGE_VERSION:-2}
    container_name: influxdb
    hostname: influxdb
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ../../lib/influxdb:/var/lib/influxdb2
      - ./config:/etc/influxdb2
#    ports:
#      - 8086:8086
    networks:
      - influxdb
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8086/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  influxdb:
    name: influxdb-net
