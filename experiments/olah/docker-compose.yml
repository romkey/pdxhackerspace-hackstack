services:
  olah:
    image: ghcr.io/romkey/olah-docker:${IMAGE_VERSION:-latest}
    container_name: olah
    hostname: olah
    restart: unless-stopped
    # bin/render-config.py overlays the host-specific settings from .env onto
    # config/configs.toml and starts olah-cli (see the README)
    entrypoint: ["python", "/app/render-config.py"]
    volumes:
      - ./bin/render-config.py:/app/render-config.py:ro
      - ./config/configs.toml:/app/configs.toml:ro
      # Cached models/datasets live on NFS - see docker volume below
      - olah_repos:/data/repos
      - ../../log/olah:/logs
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
#   ports:
#     - 8090:8090
    networks:
      - proxy

# The model cache is the only thing worth keeping, and it gets big, so it
# lives on an NFS share configured entirely from .env.
volumes:
  olah_repos:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${OLAH_NFS_HOST:?set OLAH_NFS_HOST in .env},rw,${NFS_MOUNT_OPTS:-nfsvers=4,hard}"
      device: ":${OLAH_NFS_PATH:?set OLAH_NFS_PATH in .env}"

networks:
  proxy:
    external: true
    name: nginx-proxy-net
