# Optional override: Hugging Face mirror cache on NFS instead of ../../lib/olah/repos.
#
# Enable in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.nfs.yml
#
# Requires OLAH_NFS_HOST and OLAH_NFS_PATH in .env (see .env.example).

services:
  olah:
    volumes: !override
      - ./bin/render-config.py:/app/render-config.py:ro
      - ./config/configs.toml:/app/configs.toml:ro
      - olah_repos:/data/repos
      - ../../log/olah:/logs
      - /etc/localtime:/etc/localtime:ro

volumes:
  olah_repos:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${OLAH_NFS_HOST},rw,${NFS_MOUNT_OPTS:-nfsvers=4,hard}"
      device: ":${OLAH_NFS_PATH}"
