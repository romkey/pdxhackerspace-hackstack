services:
  grafana:
    image: grafana/grafana-enterprise:${IMAGE_VERSION:-latest}
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    volumes:
      - ../../lib/grafana:/var/lib/grafana
      - ../../log/grafana:/var/log/grafana
      - ./config:/etc/grafana
#    ports:
#      - 3000:3000
    networks:
      - proxy
      - influxdb
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy:
    external: true
    name: nginx-proxy-net
  influxdb:
    external: true
    name: influxdb-net
