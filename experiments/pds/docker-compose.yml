services:
  pds:
    image: ghcr.io/bluesky-social/pds:${IMAGE_VERSION:-0.4}
    container_name: pds
    hostname: pds
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
    volumes:
      - ../../lib/pds:/pds
#    ports:
#      - "127.0.0.1:3000:3000"   # proxy to this
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/xrpc/_health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy:
    name: nginx-proxy-net
    external: true
