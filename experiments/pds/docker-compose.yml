services:
  pds:
    image: ghcr.io/bluesky-social/pds:0.4
    container_name: pds
    hostname: pds
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
    volumes:
      - ../../lib/pds:/pds
#    ports:
#      - "127.0.0.1:3000:3000"   # proxy to this

networks:
  proxy:
    name: nginx-proxy-net
    external: true
