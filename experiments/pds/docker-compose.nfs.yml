# Optional override: Bluesky PDS data on NFS.
# Enable: COMPOSE_FILE=docker-compose.yml:docker-compose.nfs.yml

services:
  pds:
    volumes: !override
      - pds_data:/pds

volumes:
  pds_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${PDS_NFS_HOST},rw,${NFS_MOUNT_OPTS:-nfsvers=4,hard}"
      device: ":${PDS_NFS_PATH}"
