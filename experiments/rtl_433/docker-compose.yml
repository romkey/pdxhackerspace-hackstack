services:
  rtl_433:
    image: hertzg/rtl_433:${IMAGE_VERSION:-master-alpine}
    container_name: rtl_433
    hostname: rtl_433
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: "/usr/local/bin/rtl_433"
    command: "-F ${MQTT_BROKER} ${RTL433_EXTRA_OPTIONS}"
    devices:
      - "${SDR_DEVICE}"
    volumes:
      - ./config:/etc/rtl_433
    networks:
      - mqtt
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f rtl_433 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  mqtt:
    external: true
    name: mosquitto-net
