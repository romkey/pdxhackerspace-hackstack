# Optional override: shared files (/w) on NFS; cfg stays local.
# Enable: COMPOSE_FILE=docker-compose.yml:docker-compose.nfs.yml

services:
  copyparty:
    volumes: !override
      - ../../lib/copyparty/cfg:/cfg
      - ./config/copyparty.conf:/cfg/copyparty.conf:ro
      - copyparty_files:/w

volumes:
  copyparty_files:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${COPYPARTY_NFS_HOST},rw,${NFS_MOUNT_OPTS:-nfsvers=4,hard}"
      device: ":${COPYPARTY_NFS_PATH}"
