# Optional override: Synapse media store on NFS; signing keys stay local.
# Enable: COMPOSE_FILE=docker-compose.yml:docker-compose.nfs.yml

services:
  synapse:
    volumes: !override
      - ./config/homeserver.yaml:/data/homeserver.yaml:ro
      - ./config/log.config:/data/log.config:ro
      - matrix_media:/data/media_store
      - ../../lib/matrix/synapse/keys:/data/keys

volumes:
  matrix_media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${MATRIX_NFS_HOST},rw,${NFS_MOUNT_OPTS:-nfsvers=4,hard}"
      device: ":${MATRIX_NFS_PATH}"
