services:
  trimetd:
    image: ghcr.io/romkey/pdxhackstack-trimetd:${IMAGE_VERSION:-latest}
    container_name: trimetd
    hostname: trimetd
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - mqtt
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f trimetd >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  mqtt:
    external: true
    name: mosquitto-net
