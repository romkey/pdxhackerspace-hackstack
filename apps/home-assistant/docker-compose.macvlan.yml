# Optional: LAN macvlan address for Home Assistant.
#
# Create the shared network first: ../../bin/create-macvlan.sh
# Enable in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.macvlan.yml
#
# Requires IPV4_ADDRESS and LAN_MAC_ADDRESS (see .env.example).

services:
  home-assistant:
    networks: !override
      hass: {}
      proxy: {}
      mqtt: {}
      db: {}
      lan:
        ipv4_address: ${IPV4_ADDRESS:?set IPV4_ADDRESS in .env}
        mac_address: ${LAN_MAC_ADDRESS:?set LAN_MAC_ADDRESS in .env}

networks:
  lan:
    name: ${LAN_NET_NAME:-lan_macvlan}
    external: true
