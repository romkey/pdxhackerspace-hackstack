# Optional: PXE/TFTP on the LAN segment (broadcast-friendly).
# Enable: COMPOSE_FILE=docker-compose.yml:docker-compose.macvlan.yml

services:
  netbootxyz:
    networks:
      lan:
        ipv4_address: ${IPV4_ADDRESS:?set IPV4_ADDRESS in .env}
        mac_address: ${LAN_MAC_ADDRESS:?set LAN_MAC_ADDRESS in .env}

networks:
  lan:
    name: ${LAN_NET_NAME:-lan_macvlan}
    external: true
