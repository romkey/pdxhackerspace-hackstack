# NVIDIA GPUs on Linux (x86_64 or arm64: discrete cards, DGX Spark GB10).
# Not for Jetson Thor; use docker-compose.jetson.yml there.
# Needs the NVIDIA Container Toolkit on the host and driver >= 580 for CUDA 13;
# for an older driver (>= 575) pin a CUDA 12.9 build, e.g. IMAGE_VERSION=v0.32.0-cu129.
#   COMPOSE_FILE=docker-compose.yml:docker-compose.nvidia.yml
services:
  vllm:
    restart: unless-stopped
    image: vllm/vllm-openai:${IMAGE_VERSION:-latest}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
