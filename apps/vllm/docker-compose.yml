# Hardware-neutral base. On its own this runs the CPU-only image; layer one of
# the hardware overrides on top via COMPOSE_FILE in .env (see README):
#   docker-compose.nvidia.yml  NVIDIA discrete GPUs and DGX Spark, CUDA 13 (driver >= 580)
#   docker-compose.spark.yml   DGX Spark community build, on top of nvidia.yml (optional)
#   docker-compose.jetson.yml  NVIDIA Jetson Thor (nvidia runtime, instead of nvidia.yml)
#   docker-compose.strix.yml   AMD Strix Halo / Strix Point APUs (ROCm), x86_64 only
#   docker-compose.arc.yml     Intel Arc (XPU), x86_64 only
services:
  vllm:
    image: vllm/vllm-openai-cpu:${IMAGE_VERSION:-latest}
    container_name: vllm
    hostname: vllm
    restart: unless-stopped
    ipc: host
    volumes:
      - ../../lib/vllm/cache:/root/.cache/vllm
      - ../../lib/vllm/huggingface:/root/.cache/huggingface
      - ./config/entrypoint.sh:/vllm-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/vllm-entrypoint.sh"]
    env_file:
      - .env
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://127.0.0.1:8000/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
#    networks:
#      - llama
#      - proxy

networks:
  llama:
    external: true
    name: llama-net
  proxy:
    external: true
    name: nginx-proxy-net
