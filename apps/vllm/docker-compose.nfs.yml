# Optional override: Hugging Face model cache on NFS; vLLM cache stays local.
# Enabled through COMPOSE_STORAGE in .env, which puts it before the hardware file
# so arc.yml's by-path mount survives the volume override.

services:
  vllm:
    volumes: !override
      - ../../lib/vllm/cache:/root/.cache/vllm
      - vllm_huggingface:/root/.cache/huggingface
      - ./config/entrypoint.sh:/vllm-entrypoint.sh:ro

volumes:
  vllm_huggingface:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${VLLM_NFS_HOST},rw,${NFS_MOUNT_OPTS:-nfsvers=4,hard}"
      device: ":${VLLM_NFS_PATH}"
