# Optional override: Hugging Face model cache on NFS.
# Enable: COMPOSE_FILE=docker-compose.yml:docker-compose.nfs.yml

services:
  vllm:
    volumes: !override
      - vllm_huggingface:/root/.cache/huggingface
      - ./config/entrypoint.sh:/vllm-entrypoint.sh:ro

volumes:
  vllm_huggingface:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${VLLM_NFS_HOST},rw,${NFS_MOUNT_OPTS:-nfsvers=4,hard}"
      device: ":${VLLM_NFS_PATH}"
