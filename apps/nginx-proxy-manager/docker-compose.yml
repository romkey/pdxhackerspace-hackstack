services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:${IMAGE_VERSION:-latest}
    container_name: nginx-proxy-manager
    hostname: nginx-proxy-manager
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # hackstack: ports required (edge HTTP/HTTPS for the stack)
    ports:
      - 80:80
      - 443:443
#      - 81:81  # admin UI; proxy a hostname to nginx-proxy-manager:81 if needed
    volumes:
      - ../../lib/nginx-proxy-manager/data:/data
      - ../../lib/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
      - ../../log/nginx-proxy-manager:/data/logs
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
    networks:
      - proxy
networks:
  proxy:
    name: nginx-proxy-net
