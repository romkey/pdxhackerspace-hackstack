# Hardware-neutral base. On its own this runs on the CPU; layer one of the
# hardware overrides on top via COMPOSE_FILE in .env (see README):
#   docker-compose.nvidia.yml  NVIDIA discrete GPUs and DGX Spark (GB10)
#   docker-compose.jetson.yml  NVIDIA Jetson Thor (nvidia runtime, instead of nvidia.yml)
#   docker-compose.strix.yml   AMD Strix Halo / Strix Point APUs (ROCm), x86_64 only
#   docker-compose.arc.yml     Intel Arc (Vulkan), x86_64 only
services:
  ollama:
    image: ollama/ollama:${IMAGE_VERSION:-latest}
    container_name: ollama
    hostname: ollama
    restart: unless-stopped
    volumes:
      - ../../lib/ollama:/root/.ollama
#    ports:
#      - 11434:11434
    networks:
      - llama
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11434')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
networks:
  llama:
    name: llama-net
