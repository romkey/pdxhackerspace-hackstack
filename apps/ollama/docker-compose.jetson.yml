# NVIDIA Jetson Thor (JetPack 7). Use instead of docker-compose.nvidia.yml, not on top of it:
# Jetson's container toolkit runs in CSV mode, which rejects device reservations
# (the --gpus equivalent) and only works through the nvidia runtime.
#   COMPOSE_FILE=docker-compose.yml:docker-compose.jetson.yml
services:
  ollama:
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
