services:
  sendspin:
    image: ghcr.io/longlivethehud/sendspin-docker:${IMAGE_VERSION:-latest}
    container_name: sendspin
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    env_file:
      - .env
    command: >
      --daemon
      --url ${SENDSPIN_SERVER}
      --name "${SENDSPIN_NAME}"
      --id ${SENDSPIN_ID}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sendspin >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
