services:
  airconnect:
    image: 1activegeek/airconnect:${IMAGE_VERSION:-latest}
    container_name: airconnect
    hostname: airconnect
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - ./config:/config
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f airconnect >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
