# Optional: LDAP outpost (manual deploy — set Outpost integration to "----" in the Admin UI).
# Enable: COMPOSE_FILE=docker-compose.yml:docker-compose.ldap.yml
# See README.md and https://docs.goauthentik.io/add-secure-apps/outposts/manual-deploy-docker-compose/

services:
  authentik-ldap:
    image: ghcr.io/goauthentik/ldap:${IMAGE_VERSION:-latest}
    container_name: authentik-ldap
    hostname: authentik-ldap
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTHENTIK_HOST: ${AUTHENTIK_LDAP_OUTPOST_HOST:?set AUTHENTIK_LDAP_OUTPOST_HOST in .env}
      AUTHENTIK_INSECURE: ${AUTHENTIK_LDAP_OUTPOST_INSECURE:-false}
      AUTHENTIK_TOKEN: ${AUTHENTIK_LDAP_OUTPOST_TOKEN:?set AUTHENTIK_LDAP_OUTPOST_TOKEN in .env}
    # hackstack: ports required (LDAP/LDAPS for hosts and apps outside nginx-proxy-net)
    ports:
      - "${LDAP_PORT:-389}:3389"
      - "${LDAPS_PORT:-636}:6636"
    networks:
      - proxy
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 2 bash -c '</dev/tcp/127.0.0.1/3389' || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

networks:
  proxy:
    external: true
    name: nginx-proxy-net
