services:
  cups:
    image: olbat/cupsd:${IMAGE_VERSION:-latest}
    container_name: cups
    hostname: cups
    restart: unless-stopped
    entrypoint: /entrypoint.sh
    volumes:
      - /var/run/dbus:/var/run/dbus
      - ../../lib/cups/etc:/etc/cups
      - ../../lib/cups/lib:/var/lib/cups
      - ../../lib/cups/custom-filters:/custom-filters
      - ./config/entrypoint.sh:/entrypoint.sh:ro
      - ./ppds:/usr/share/cups/model/custom:ro
    # hackstack: ports required when not using macvlan (IPP on the host)
    ports:
      - 631:631
    networks:
      cups:
      proxy:
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:631/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  cups:
    name: cups-net
  proxy:
    external: true
    name: nginx-proxy-net
