services:
  sensors2mqtt:
    image: kevinpdavid/sensors2mqtt:${IMAGE_VERSION:-main}
    container_name: sensors2mqtt
    hostname: sensors2mqtt
    privileged: true
    restart: unless-stopped
    networks:
      - mqtt
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sensors2mqtt >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities:
                - gpu
networks:
  mqtt:
    name: mosquitto-net
    external: true
