# Optional override: book library on NFS; config stays local. ebooks volume from base compose.
# Enable: COMPOSE_FILE=docker-compose.yml:docker-compose.nfs.yml

services:
  calibre-web:
    volumes: !override
      - ../../lib/calibre-web/config:/config
      - calibre_books:/books
      - ebooks:/ebooks-new

volumes:
  calibre_books:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${CALIBRE_WEB_NFS_HOST},rw,${NFS_MOUNT_OPTS:-nfsvers=4,hard}"
      device: ":${CALIBRE_WEB_NFS_PATH}"
