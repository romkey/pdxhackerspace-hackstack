services:
  backrest:
    image: garethgeorge/backrest:${IMAGE_VERSION:-latest}
    container_name: backrest
    hostname: backrest
    volumes:
      - ./config:/config
      - ../../lib/backrest:/data
      - ${BACKREST_CACHE_PATH}:/cache
      - ${BACKREST_REPOS_PATH}:/repos
      - ${BACKREST_USERDATA_PATH:-/opt/hackstack}:/userdata
      - ${BACKREST_USERETC_PATH:-/etc}:/useretc
      - ${BACKREST_USERHOME_PATH:-/home}:/userhome
    env_file:
      - .env
    restart: unless-stopped
#    ports:
#      - 9898:9898
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9898/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
networks:
  default:
    external: true
    name: nginx-proxy-net
