services:
  db-backup:
    image: ghcr.io/romkey/hackstack-db-backup:${IMAGE_VERSION:-latest}
    container_name: db-backup
    hostname: db-backup
    restart: unless-stopped
    user: "${BACKUP_UID:-0}:${BACKUP_GID:-0}"
    env_file:
      - .env
    volumes:
      - ${DBBACKUP_PARENT_HOST_PATH}:/opt:ro
      - ${DBBACKUP_DEST_PATH}:/dest
    networks:
      - postgresql
      - mariadb
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[b]ackup.rb' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

networks:
  postgresql:
    external: true
    name: postgres-net
  mariadb:
    external: true
    name: mariadb-net
  quantdb:
    external: true
    name: quantdb-net
