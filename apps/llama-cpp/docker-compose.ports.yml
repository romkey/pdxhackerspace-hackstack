# Optional: publish the port on the host, for servers without a reverse proxy.
# Enabled through COMPOSE_ACCESS in .env (see .env.example).
services:
  llama-cpp:
    # hackstack: ports required - this overlay exists to publish the port
    ports:
      - "${PUBLISHED_ADDRESS:-0.0.0.0}:${PUBLISHED_PORT:-8080}:${LLAMA_ARG_PORT:-8080}"
