# Optional override: GGUF models on NFS.
# Add it last in COMPOSE_FILE, e.g.
#   COMPOSE_FILE=docker-compose.yml:docker-compose.nvidia.yml:docker-compose.nfs.yml

services:
  llama-cpp:
    volumes: !override
      - llama_cpp_models:/models

volumes:
  llama_cpp_models:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${LLAMA_CPP_NFS_HOST},rw,${NFS_MOUNT_OPTS:-nfsvers=4,hard}"
      device: ":${LLAMA_CPP_NFS_PATH}"
