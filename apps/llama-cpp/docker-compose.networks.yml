# Optional: attach to the Hackstack networks so the reverse proxy and other
# containers (openwebui, home-assistant, ...) reach it as llama-cpp:8080.
# Enabled through COMPOSE_ACCESS in .env (see .env.example).
services:
  llama-cpp:
    networks:
      - llama
      - proxy

networks:
  llama:
    external: true
    name: llama-net
  proxy:
    external: true
    name: nginx-proxy-net
