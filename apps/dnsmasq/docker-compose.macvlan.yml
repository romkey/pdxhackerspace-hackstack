# Optional: DNS on a dedicated LAN IP instead of network_mode: host.
# Enable: COMPOSE_FILE=docker-compose.yml:docker-compose.macvlan.yml
# dnsmasq.conf must listen on ${IPV4_ADDRESS} (bind-interfaces / listen-address as you use today).

services:
  dnsmasq:
    network_mode: !reset null
    networks: !override
      lan:
        ipv4_address: ${IPV4_ADDRESS:?set IPV4_ADDRESS in .env}
        mac_address: ${LAN_MAC_ADDRESS:?set LAN_MAC_ADDRESS in .env}

networks:
  lan:
    name: ${LAN_NET_NAME:-lan_macvlan}
    external: true
