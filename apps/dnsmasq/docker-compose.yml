services:
  dnsmasq:
    restart: unless-stopped
    build: .
    container_name: dnsmasq
    hostname: dnsmasq
    network_mode: host
    volumes:
      - ./config/dnsmasq.conf:/etc/dnsmasq.conf
      - ../../lib/dnsmasq/hosts.d:/etc/hosts.d
      - ../../lib/dnsmasq/autohosts.d:/etc/autohosts.d
#    ports:
#      - "53:53/udp"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "autoheal=true"
    healthcheck:
#      test: ["CMD-SHELL", "pidof dnsmasq >/dev/null || exit 1"]
      test: ["CMD-SHELL", "nslookup -timeout=2 staging.ctrlh 127.0.0.1 >/dev/null && dig +time=2 +tries=1 @127.0.0.1 google.com >/dev/null || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
