services:
  litellm:
    image: ghcr.io/berriai/litellm:${IMAGE_VERSION:-main-stable}
    hostname: litellm
    container_name: litellm
    restart: unless-stopped
#    ports:
#      - "4000:4000"
    volumes:
      - ./config/config.yaml:/app/config.yaml
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - proxy
      - db
      - redis
      - mail
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://127.0.0.1:4000/health/liveliness >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:${REDIS_IMAGE_VERSION:-7-alpine}
    container_name: litellm-redis
    command: redis-server --save 3600 1 --appendonly no
    volumes:
      - ../../lib/litellm/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - redis

networks:
  redis:
    name: litellm-redis-net
  proxy:
    name: nginx-proxy-net
    external: true
  db:
    name: postgres-net
    external: true
  mail:
    name: postfix-net
    external: true
