name: Update .rsync.exclude

on:
  push:
    paths:
      - "apps/**/.rsync.exclude"
      - "experiments/**/.rsync.exclude"
      - ".rsync.exclude.initial"
      - ".github/workflows/concatenate_rsync_exclude.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rsync-exclude:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Concatenate .rsync.exclude files
        run: |
          # Start with the .rsync.exclude.initial file
          cp .rsync.exclude.initial .rsync.exclude

          # Per-app files already hold paths relative to the backup root
          # (e.g. lib/<app>/app.db), so they're copied as-is.
          for parent_dir in apps experiments; do
            if [ ! -d "$parent_dir" ]; then
              continue
            fi

            find "$parent_dir" -mindepth 2 -maxdepth 2 -name ".rsync.exclude" | sort | \
            while read -r rsync_exclude; do
              echo "" >> .rsync.exclude
              echo "# [$parent_dir] $rsync_exclude" >> .rsync.exclude
              cat "$rsync_exclude" >> .rsync.exclude
              # Guard against a file without a trailing newline
              if [ -n "$(tail -c1 "$rsync_exclude")" ]; then
                echo "" >> .rsync.exclude
              fi
            done
          done

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain .rsync.exclude)" ]]; then
            echo "changes=true" >> $GITHUB_ENV
          else
            echo "changes=false" >> $GITHUB_ENV
          fi

      - name: Commit and push if changes exist
        if: env.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .rsync.exclude
          git commit -m "Update top-level .rsync.exclude from per-app files"
          git push origin HEAD:${GITHUB_REF_NAME}
